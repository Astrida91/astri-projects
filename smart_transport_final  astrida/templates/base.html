<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Transport{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Custom CSS for buttons and other theme styles -->
    <style>
        /* General Styles */
        body {
            background-color: #f4f1e1;  /* Light beige background */
            font-family: 'Georgia', serif;  /* Serif font */
        }

        /* Button Styling for All Buttons */
        .btn {
            font-family: 'Georgia', serif;
            border-radius: 30px;  /* Rounded edges */
            padding: 12px 30px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);  /* Subtle shadow */
        }

        /* Primary Button (Main actions like login, register, etc.) */
        .btn-primary {
            background-color: #6b4f3d;  /* Earthy brown */
            color: #fff;
            border: 2px solid #6b4f3d;
        }

        .btn-primary:hover {
            background-color: #ffd700;  /* Golden on hover */
            color: #6b4f3d;
            transform: scale(1.05);
        }

        /* Secondary Button (For less important actions) */
        .btn-secondary {
            background-color: #d1b89b;  /* Soft beige */
            color: #6b4f3d;
            border: 2px solid #d1b89b;
        }

        .btn-secondary:hover {
            background-color: #b8a47e;
            color: #fff;
            transform: scale(1.05);
        }

        /* Outline Buttons */
        .btn-outline-light {
            background-color: transparent;
            border: 2px solid #fff;
            color: #fff;
        }

        .btn-outline-light:hover {
            background-color: #6b4f3d;
            color: #fff;
            border-color: #6b4f3d;
        }

        /* Get Started Button */
        .btn-get-started {
            background-color: #6b4f3d;
            color: #fff;
            font-size: 1.2rem;
            border-radius: 30px;
            padding: 12px 30px;
            transition: all 0.3s ease;
        }

        .btn-get-started:hover {
            background-color: #ffd700;
            color: #6b4f3d;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Brand -->
            <a class="navbar-brand" href="/">Smart Transport</a>
        
            <!-- Navbar Links -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'about' %}">About Us</a>
                </li>
            </ul>
        
            <!-- User Options -->
            <div class="ml-auto d-flex align-items-center">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}" class="btn btn-outline-light me-2">Profile</a>
                    <a href="{% url 'buses:bus_list' %}" class="btn btn-outline-light me-2">View Buses</a>
                    
                    <form method="POST" action="{% url 'accounts:logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-outline-light me-2">Login</a>
                    <a href="{% url 'accounts:register' %}" class="btn btn-outline-light">Register</a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container mt-4">
        {% block content %}
        
        <!-- Get Started Button (Can be placed anywhere) -->
        <div class="text-center my-5">
            <a href="{% url 'get_started' %}" class="btn btn-get-started">Get Started</a>
        </div>

        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center mt-5">
        <p>&copy; 2024 Smart Transport. All rights reserved</p>
    </footer>

    <!-- Bootstrap Bundle with Popper (needed for components like Carousel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

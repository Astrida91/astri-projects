{% extends 'base.html' %}
{% block content %}
<!-- Custom CSS for Originated Theme -->
<style>
    /* General Styles */
    body {
        background-color: #f4f1e1;  /* Light beige background, evoking a natural origin feel */
        font-family: 'Georgia', serif;  /* A more classic font for a vintage look */
    }

    /* Card Styling */
    .card {
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border: 2px solid #8e7c54;  /* Earthy brown border */
        background-color: #fff7e6;  /* Pale cream background inside the card */
    }

    /* Card Header */
    .card-header {
        background-color: #8e7c54;  /* Rich brown header */
        color: white;
        font-size: 1.5rem;
        text-align: center;
        padding: 20px;
        background-image: url('https://www.example.com/path-to-wood-texture.jpg'); /* Optional: Add a wood texture to header */
        background-size: cover;
        background-position: center;
    }

    /* Profile Image Styling */
    .img-fluid {
        border: 3px solid #8e7c54;  /* Earthy border around profile image */
    }

    /* Button Hover Effects */
    .btn-primary {
        background-color: #6b4f3d;  /* Earthy brown for buttons */
        border-color: #6b4f3d;
    }

    .btn-primary:hover {
        background-color: #5c4133;  /* Darker brown for hover */
        border-color: #5c4133;
        transition: all 0.3s ease-in-out;
    }

    .btn-secondary {
        background-color: #d1b89b;  /* Lighter beige for secondary buttons */
        border-color: #d1b89b;
    }

    .btn-secondary:hover {
        background-color: #b8a47e;  /* Slightly darker beige for hover */
        border-color: #b8a47e;
        transition: all 0.3s ease-in-out;
    }

    /* Form Styles */
    .form-control {
        border-color: #8e7c54;  /* Earthy border for form fields */
        background-color: #fff7e6;  /* Light beige background for input fields */
    }

    .form-control:focus {
        border-color: #6b4f3d;  /* Darker brown when focused */
        box-shadow: 0 0 5px rgba(107, 79, 61, 0.75);
    }

    /* Success Message */
    .alert-success {
        background-color: #8e7c54;
        color: white;
        border-radius: 5px;
        padding: 10px;
    }

    /* Vintage Border on Card and Form Fields */
    .vintage-border {
        border: 2px dashed #8e7c54;
        padding: 20px;
    }

</style>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card vintage-border">
                <div class="card-header">
                    <h2>Change Password</h2>
                </div>
                <div class="card-body">
                    <!-- Display success message if password changed successfully -->
                    {% if messages %}
                        <div class="alert alert-success">
                            {% for message in messages %}
                                <p>{{ message }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                    
                    <!-- Form for changing password -->
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}  <!-- Render form fields here -->
                        <button type="submit" class="btn btn-primary mt-3">Change Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
